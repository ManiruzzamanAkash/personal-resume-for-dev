<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="32"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8345dd"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <!-- y=-6 + height=80 anchors the face slightly above center so the head fills the circle -->
    <image x="-8" y="-6" width="80" height="80" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,"/>
  </g>
</svg>
