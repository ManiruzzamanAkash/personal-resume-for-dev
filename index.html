<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maniruzzaman Akash — WordPress Plugin Developer & Software Architect</title>
  <meta name="description" content="Senior WordPress Plugin Developer & Software Architect with 7+ years of experience." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://assets.calendly.com/assets/external/widget.css" />
  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0a0b" /><text x="50" y="62" font-family="serif" font-size="42" font-style="italic" text-anchor="middle" fill="#a78bfa">A</text></svg>
  </template>
</head>
<body>
  <div id="app"></div>

  <!-- Vendor: React, Babel, marked (markdown), Prism (syntax highlighting) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup-templating.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-php.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-jsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-tsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>

  <!--
    Script load order matters — Babel-standalone executes each in sequence
    in the global scope. Dependencies must come before consumers.

    1. tweaks-panel.jsx   — provides useTweaks + TweaksPanel/* controls
    2. src/lib.jsx        — routing, theme, motion primitives, icons (I)
    3. src/data.js        — SITE, PROJECTS, EXPERIENCE, SKILLS, ...
    4. src/markdown.js    — article loading + frontmatter parser
    5. src/components.jsx — Nav, Footer, ContactCTA, ContribGrid, ...
    6. src/pages/*.jsx    — page components (use everything above)
    7. src/App.jsx        — root, mounts to #app
  -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/lib.jsx"></script>
  <script type="text/babel" src="src/data.js"></script>
  <script type="text/babel" src="src/markdown.js"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/pages/Home.jsx"></script>
  <script type="text/babel" src="src/pages/Resume.jsx"></script>
  <script type="text/babel" src="src/pages/Blog.jsx"></script>
  <script type="text/babel" src="src/pages/Article.jsx"></script>
  <script type="text/babel" src="src/pages/Contact.jsx"></script>
  <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
